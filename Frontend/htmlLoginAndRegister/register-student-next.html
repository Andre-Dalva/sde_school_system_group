<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register-Student</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/register.css">
    <script src="https://kit.fontawesome.com/ed8ed1d0d5.js" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
</head>
<body>
    <nav class="topBar">
        <div>
            <a href="../index.html"><h1 id="siteTitle">Liceu Nacional</h1></a>
        </div>
        <div id="topButtons">
            <a href="../index.html">
                <h2>Home</h2>
            </a>
            <a href="login.html">
                <button class="loginButton"> LOG IN</button>
                <hr class="indicatingBar" id="barForRegister">
            </a>
        </div>
        <hr id="dividingBar">
    </nav>
    <main>
         <form action="" class="registerForm">
            <h2 id="formTitle">Create an Account</h2>
            <div class="formSection">
                <label class="formLabel" for="userPassword">Password:</label><br>
                <input type="password" class="formBox" id="userPassword" placeholder="email or username...">
            </div>
            <div class="formSection">
                <label class="formLabel" for="userPassword2">Repeat the password:</label><br>
                <input type="email" class="formBox" id="userPassword2" placeholder="type your password...">
            </div>
            <div class="formSection" id="registerBlock">
            <a href="register-student-final.html">
                    <button class="nextButton" type="button"><i class="fa-solid fa-arrow-right" style="color: #dbd8d8;"></i></button>
                </a>
            </div>
        </form>
    </main>
</body>
