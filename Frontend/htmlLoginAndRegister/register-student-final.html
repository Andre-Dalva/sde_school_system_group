<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register-Student</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/register-student.css">
    <script src="https://kit.fontawesome.com/ed8ed1d0d5.js" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
</head>
<body>
    <nav class="topBar">
        <div>
            <a href="../index.html"><h1 id="siteTitle">Liceu Nacional</h1></a>
        </div>
        <div id="topButtons">
            <a href="../index.html">
                <h2>Home</h2>
            </a>
            <a href="login.html">
                <button class="loginButton"> LOG IN</button>
                <hr class="indicatingBar" id="barForRegister">
            </a>
        </div>
    </nav>
    <hr id="dividingBar">
    <main>
         <form action="" class="loginForm">
            <h2 id="formTitle">Create an Account</h2>
            <div class="formSection">
                <label class="formLabel" for="6DigitCode">6-Digit Code:</label><br>
                <input type="text" class="formBox" id="6DigitCode" placeholder="email or username...">
            </div>
            <div class="formSection" id="registerBlock">
                <button class="nextButton" type="submit">Sign Up</button>
            </div>
        </form>
    </main>
